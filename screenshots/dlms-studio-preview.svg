  <!-- Header Banner -->
  <rect x="50" y="40" width="1100" height="90" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <circle cx="95" cy="85" r="24" fill="#00E5FF" opacity="0.15" />
  <text x="95" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#00E5FF" text-anchor="middle">⚡</text>
  <text x="135" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">DLMSForge <tspan fill="#00E5FF">Pro</tspan></text>
  <text x="135" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">IEC 62056 DLMS/COSEM Smart Metering APDU Studio &amp; Blue Book Auditor</text>

  <!-- Status badges -->
  <rect x="850" y="68" width="110" height="32" rx="16" fill="#00E5FF" opacity="0.1" stroke="#00E5FF" stroke-width="1" />
  <text x="905" y="89" font-family="monospace" font-size="12" font-weight="700" fill="#00E5FF" text-anchor="middle">IEC 62056</text>
  <rect x="975" y="68" width="145" height="32" rx="16" fill="#10b981" opacity="0.1" stroke="#10b981" stroke-width="1" />
  <text x="1047" y="89" font-family="monospace" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle">AUDIT: 10/10 PASS</text>

  <!-- Left Card: AARQ & OBIS Engine -->
  <rect x="50" y="150" width="535" height="500" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="80" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">AARQ Association &amp; OBIS Registry</text>

  <!-- AARQ Parameters Box -->
  <g transform="translate(80, 215)">
    <rect x="0" y="0" width="475" height="120" rx="8" fill="#030712" stroke="#1e293b" />
    <text x="15" y="26" font-family="monospace" font-size="12" fill="#94a3b8">Application Context: <tspan fill="#00E5FF">2.16.756.5.8.1.1 (LN without ciphering)</tspan></text>
    <text x="15" y="50" font-family="monospace" font-size="12" fill="#94a3b8">Authentication:      <tspan fill="#7C4DFF">Low-Level Security (LLS / Password: 00000000)</tspan></text>
    <text x="15" y="74" font-family="monospace" font-size="12" fill="#94a3b8">Client / Server SAP: <tspan fill="#f59e0b">Client 16 (Public) / Server 1 (Logical Device)</tspan></text>
    <text x="15" y="98" font-family="monospace" font-size="12" fill="#94a3b8">xDLMS Conformance:   <tspan fill="#10b981">0x007E1F (Read, Write, BlockTransfer, Attrib0)</tspan></text>
  </g>

  <!-- GET Request Dissection -->
  <text x="80" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">GET-Request-Normal (OBIS 1.0.1.8.0.255):</text>
  <rect x="80" y="385" width="475" height="85" rx="8" fill="#030712" stroke="#1e293b" />
  <text x="95" y="412" font-family="monospace" font-size="15" font-weight="700" fill="#facc15">c0 01 c1 00 03 01 00 01 08 00 ff 02 00</text>
  <text x="95" y="435" font-family="monospace" font-size="11" fill="#38bdf8">Tag: GET-Request (0xC0), Subtype: Normal (0x01), Invoke-ID: 0xC1</text>
  <text x="95" y="452" font-family="monospace" font-size="11" fill="#38bdf8">Class 3 (Register), OBIS 1.0.1.8.0.255 (Active Energy Import), Attr 2 (Value)</text>

  <!-- HDLC Framing Frame Box -->
  <text x="80" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#94a3b8">IEC 62056-46 HDLC Framing (CRC-16 FCS):</text>
  <rect x="80" y="510" width="475" height="115" rx="8" fill="#090d16" stroke="#1e293b" />
  <text x="95" y="535" font-family="monospace" font-size="13" font-weight="700" fill="#34d399">7e a0 1b 03 21 10 d2 b7 c0 01 ... f6 88 7e</text>
  <text x="95" y="560" font-family="monospace" font-size="11" fill="#cbd5e1">Header Format: 0xA01B | Server Addr: 0x03 | Client Addr: 0x21</text>
  <text x="95" y="582" font-family="monospace" font-size="11" fill="#cbd5e1">HCS: 0xD2B7 (Valid) | FCS: 0xF688 (CRC-16 Polynomial x^16+x^12+x^5+1)</text>
  <text x="95" y="605" font-family="monospace" font-size="11" fill="#10b981">✓ Direct Optical Probe &amp; RS-485 Serial Protocol Ready</text>


